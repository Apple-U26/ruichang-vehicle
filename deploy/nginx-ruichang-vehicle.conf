# 车辆管理 Nginx 优化配置
# 使用前把 server_name 改成实际域名或服务器 IP
# 已用 certbot 配置 HTTPS 时，把下面 location 块合并进现有 server 块

server {
    listen 80;
    server_name ruichang.site;

    client_max_body_size 20m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # 首页不缓存，确保发布后立即拿到新版本
    location = /index.html {
        add_header Cache-Control "no-cache";
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # 前端静态资源由 Nginx 直接读取并长缓存
    location /assets/ {
        alias /home/ubuntu/ruichang-vehicle/frontend/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # 上传图片
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其他页面由后端托管
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
